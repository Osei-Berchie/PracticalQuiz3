<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solar System – CEIS 273</title>
  <script src="script/aframe.min.js"></script>

  <script>
    /**
     * orbit component
     * Rotates the entity around the Y-axis of its PARENT at a given speed,
     * keeping the planet at its defined x-offset (orbital radius).
     */
    AFRAME.registerComponent('orbit', {
      schema: {
        speed: { type: 'number', default: 1 }   // degrees per second
      },
      tick: function (time, delta) {
        // delta is ms → convert to seconds
        var deg = (this.data.speed * delta) / 1000;
        this.el.object3D.rotation.y += THREE.MathUtils.degToRad(deg);
      }
    });
  </script>
</head>
<body>
<a-scene background="color: #000005">

  <!-- ═══════════════════════  ASSETS  ═══════════════════════ -->
  <a-assets>
    <img id="sky"     src="texture/2k_stars_milky_way.jpg" />
    <img id="sun"     src="texture/2k_sun.jpg" />
    <img id="mercury" src="texture/2k_mercury.jpg" />
    <img id="venus"   src="texture/2k_venus_atmosphere.jpg" />
    <img id="earth"   src="texture/2k_earth_daymap.jpg" />
    <img id="moon"    src="texture/2k_moon.jpg" />
    <img id="mars"    src="texture/2k_mars.jpg" />
    <img id="jupiter" src="texture/2k_jupiter.jpg" />
    <img id="saturn"  src="texture/2k_saturn.jpg" />
    <img id="sring"   src="texture/2k_saturn_ring_alpha.png" />
    <img id="uranus"  src="texture/2k_uranus.jpg" />
    <img id="neptune" src="texture/2k_neptune.jpg" />
  </a-assets>

  <!-- ═══════════════════════  SKY  ═══════════════════════ -->
  <a-sky src="#sky" rotation="0 -90 0"></a-sky>

  <!-- ═══════════════════════  CAMERA  ═══════════════════════ -->
  <a-entity position="0 8 55">
    <a-camera look-controls wasd-controls>
      <a-cursor color="#ffffff" fuse="false"></a-cursor>
    </a-camera>
  </a-entity>

  <!-- ═══════════════════════  SUN  ═══════════════════════ -->
  <!-- The Sun sits at the origin and emits light -->
  <a-sphere id="sun-body"
    position="0 0 0"
    radius="5"
    src="#sun"
    emissive="#ff6600"
    emissive-intensity="0.6">
  </a-sphere>

  <!-- Point light from the sun -->
  <a-light type="point" position="0 0 0" intensity="2.5" distance="300" decay="1"></a-light>
  <!-- Ambient fill so dark sides are not pitch black -->
  <a-light type="ambient" intensity="0.15"></a-light>

  <!--
    ═══════════════════════════════════════════════════════════
    ORBIT PIVOT PATTERN
    Each planet lives inside an <a-entity> pivot centred on the
    Sun (position="0 0 0").  The 'orbit' component rotates the
    pivot around Y.  The planet sphere is offset on X by its
    orbital radius so it circles the Sun.
    ═══════════════════════════════════════════════════════════
  -->

  <!-- ── MERCURY  r=0.38  orbit=9  speed=47.4 ── -->
  <a-entity orbit="speed: 47.4">
    <a-sphere position="9 0 0" radius="0.38" src="#mercury"></a-sphere>
  </a-entity>

  <!-- ── VENUS  r=0.95  orbit=13  speed=35.0 ── -->
  <a-entity orbit="speed: 35.0">
    <a-sphere position="13 0 0" radius="0.95" src="#venus"></a-sphere>
  </a-entity>

  <!-- ── EARTH + MOON  orbit=18  speed=29.8 ── -->
  <a-entity orbit="speed: 29.8">
    <!-- Earth -->
    <a-sphere id="earth-body" position="18 0 0" radius="1" src="#earth"></a-sphere>
    <!-- Moon orbits Earth: nested pivot at Earth's position -->
    <a-entity position="18 0 0" orbit="speed: 13.0">
      <a-sphere position="2 0 0" radius="0.27" src="#moon"></a-sphere>
    </a-entity>
  </a-entity>

  <!-- ── MARS  r=0.53  orbit=24  speed=24.1 ── -->
  <a-entity orbit="speed: 24.1">
    <a-sphere position="24 0 0" radius="0.53" src="#mars"></a-sphere>
  </a-entity>

  <!-- ── JUPITER  r=2.8  orbit=33  speed=13.1 ── -->
  <a-entity orbit="speed: 13.1">
    <a-sphere position="33 0 0" radius="2.8" src="#jupiter"></a-sphere>
  </a-entity>

  <!-- ── SATURN + RING  r=2.3  orbit=44  speed=9.7 ── -->
  <a-entity orbit="speed: 9.7">
    <!-- Saturn body -->
    <a-sphere position="44 0 0" radius="2.3" src="#saturn"></a-sphere>
    <!-- Ring: a flat torus-like disc using a cylinder with minimal height -->
    <a-cylinder position="44 0 0"
      radius-top="4.2" radius-bottom="4.2"
      height="0.05"
      src="#sring"
      opacity="0.75"
      side="double"
      open-ended="true">
    </a-cylinder>
  </a-entity>

  <!-- ── URANUS  r=1.6  orbit=56  speed=6.8 ── -->
  <a-entity orbit="speed: 6.8">
    <a-sphere position="56 0 0" radius="1.6" src="#uranus"></a-sphere>
  </a-entity>

  <!-- ── NEPTUNE  r=1.55  orbit=68  speed=5.4 ── -->
  <a-entity orbit="speed: 5.4">
    <a-sphere position="68 0 0" radius="1.55" src="#neptune"></a-sphere>
  </a-entity>

  <!--
    ═══════════════════════════════════════════════════════════
    ORBIT PATH RINGS (visual guides, static)
    ═══════════════════════════════════════════════════════════
  -->
  <a-torus position="0 0 0" radius="9"  tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="13" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="18" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="24" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="33" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="44" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="56" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>
  <a-torus position="0 0 0" radius="68" tube="0.04" rotation="90 0 0" color="#ffffff" opacity="0.12" segments-tubular="64"></a-torus>

</a-scene>
</body>
</html>
